<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Box &amp; Bones</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305050a'/%3E%3Cpath d='M4 11 16 5l12 6-12 6z' fill='%23e8c96a'/%3E%3Cpath d='M4 11v12l12 6V17z' fill='%23c9a94f'/%3E%3Cpath d='M28 11v12l-12 6V17z' fill='%23a9873a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport">
      <canvas id="scene"></canvas>
    </div>

    <div id="crosshair"></div>

    <div id="prompt" class="hidden"></div>

    <div id="hud">
      <div id="hud-mode"></div>
      <div id="hud-objective"></div>
      <div id="hud-slots"></div>
    </div>

    <div id="minimap-wrap" class="hidden">
      <canvas id="minimap" width="180" height="180"></canvas>
    </div>

    <div id="compass-wrap" class="hidden">
      <div id="compass-dial">
        <div id="compass-needle"></div>
      </div>
    </div>

    <div id="modal-layer" class="hidden">
      <div id="modal-box">
        <button id="modal-close" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <div id="start-overlay">
      <h1>Box &amp; Bones</h1>
      <p>An old-school maze crawler.</p>
      <button id="start-button">Begin</button>
    </div>

    <div id="fade-overlay"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
