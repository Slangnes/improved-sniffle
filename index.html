<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Box &amp; Bones</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305050a'/%3E%3Cpath d='M4 11 16 5l12 6-12 6z' fill='%23e8c96a'/%3E%3Cpath d='M4 11v12l12 6V17z' fill='%23c9a94f'/%3E%3Cpath d='M28 11v12l-12 6V17z' fill='%23a9873a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport">
      <canvas id="scene"></canvas>
    </div>

    <div id="crosshair"></div>

    <div id="prompt" class="hidden"></div>

    <div id="hud">
      <div id="hud-mode"></div>
      <div id="hud-objective"></div>
    </div>

    <div id="hand-left" class="hand-slot empty">
      <span class="hand-tag">L</span><span class="hand-icon"></span><span class="hand-face"></span>
    </div>
    <div id="hand-right" class="hand-slot empty">
      <span class="hand-tag">R</span><span class="hand-icon"></span><span class="hand-face"></span>
    </div>

    <button id="box-entry" type="button" title="Look into your box" aria-label="Look into your box">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 11 16 5l12 6-12 6z" fill="#e8c96a"/>
        <path d="M4 11v12l12 6V17z" fill="#c9a94f"/>
        <path d="M28 11v12l-12 6V17z" fill="#a9873a"/>
      </svg>
    </button>

    <div id="modal-layer" class="hidden">
      <div id="modal-box">
        <div id="modal-content"></div>
      </div>
      <div id="modal-dismiss-hint" class="hidden">tap anywhere outside to step back</div>
    </div>

    <div id="fade-overlay"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
